<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha Beta Sigma</title>
<meta name="description" content="Bist du Alpha, Beta oder Sigma? Finde es heraus.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;900&display=swap">
<style>
  /* Layout: einspaltiges, zentriertes Quiz auf dunklem "Testosteron-Poster"-Grund,
     ein Screen zur Zeit (Intro -> Frage -> Ergebnis), große kondensierte Headlines. */
  :root {
    --bg: #0a0a0d;
    --surface: #15151e;
    --surface-2: #1d1d29;
    --fg: #edecf3;
    --muted: #8b8ba2;
    --accent: #ff5a1f;      /* molten orange */
    --accent-2: #ffb020;    /* gold */
    --danger: #ff2d55;      /* durchgefallen */
    --line: rgba(255,255,255,.1);
    color-scheme: dark;
    --maxw: 640px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,90,31,.14), transparent 60%),
      radial-gradient(900px 500px at 50% 120%, rgba(255,45,85,.08), transparent 55%),
      var(--bg);
    color: var(--fg);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding-inline: 22px;
    padding-block: clamp(36px, 8vw, 72px);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  /* jeder Screen ordnet seine Inhalte selbst mit großzügigem Abstand */
  .screen { display: flex; flex-direction: column; animation: rise .35s ease both; }
  #intro  { gap: clamp(22px, 4.5vw, 32px); }
  #quiz   { gap: clamp(20px, 4vw, 28px); }
  #result { gap: clamp(18px, 3.8vw, 26px); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

  .display {
    font-family: "Anton", "Archivo", Impact, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .5px;
    line-height: .96;
    text-wrap: balance;
    margin: 0;
  }
  .eyebrow {
    font-family: "Anton", sans-serif;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 13px;
    color: var(--accent);
    margin: 0;
  }
  .muted { color: var(--muted); }

  /* --- Intro --- */
  h1.title { font-size: clamp(48px, 15vw, 104px); }
  h1.title .a { color: var(--accent); }
  h1.title .b { color: var(--fg); }
  h1.title .s { color: var(--accent-2); }
  .sub { font-size: clamp(16px, 4.2vw, 20px); color: var(--muted); max-width: 46ch; margin: 0; }
  .spectrum { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 15px; font-size: 14px; font-weight: 600;
  }
  .chip .emo { font-size: 18px; }
  .btn {
    appearance: none; cursor: pointer; border: none;
    font-family: "Anton", sans-serif; text-transform: uppercase; letter-spacing: 1.5px;
    font-size: 20px; color: #140a03;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    padding: 17px 22px; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(255,90,31,.35);
    transition: transform .12s ease, box-shadow .12s ease;
    width: 100%;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(255,90,31,.45); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

  /* --- Quiz --- */
  .bar { height: 8px; background: var(--surface); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .3s ease; }
  .qmeta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
  .question { font-size: clamp(26px, 7vw, 42px); line-height: 1.04; }
  .answers { display: flex; flex-direction: column; gap: 12px; }
  .ans {
    text-align: left; cursor: pointer;
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 17px 19px; font-size: 16px; font-weight: 500;
    transition: border-color .12s ease, background .12s ease, transform .08s ease;
    font-family: inherit;
  }
  .ans:hover { border-color: var(--accent); background: var(--surface-2); }
  .ans:active { transform: scale(.99); }
  .ans:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* --- Result --- */
  .result-emo { font-size: clamp(72px, 24vw, 140px); line-height: 1; filter: drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
  .verdict { font-family: "Anton", sans-serif; text-transform: uppercase; letter-spacing: 3px; font-size: 14px; margin: 0; color: var(--danger); animation: flick 1.6s steps(2) infinite; }
  @keyframes flick { 0%, 92%, 100% { opacity: 1; } 95% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .verdict { animation: none; } }
  h2.rtitle { font-size: clamp(40px, 12vw, 80px); color: var(--danger); }
  .alias { font-size: clamp(18px, 5vw, 26px); font-weight: 700; margin: 0; }
  .rdesc { font-size: 16px; line-height: 1.6; color: var(--fg); max-width: 50ch; margin: 0; }
  .rdesc .muted { display: block; margin-top: 14px; }
  .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .btn.ghost {
    background: transparent; color: var(--fg); border: 1px solid var(--line);
    box-shadow: none; font-size: 16px;
  }
  .btn.ghost:hover { border-color: var(--fg); transform: none; box-shadow: none; }
  .toast { font-size: 14px; color: var(--accent-2); font-weight: 600; min-height: 18px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- INTRO -->
  <section id="intro" class="screen">
    <p class="eyebrow">Der wissenschaftlich fragwürdige Test</p>
    <h1 class="title display"><span class="a">Alpha</span> <span class="b">Beta</span> <span class="s">Sigma</span></h1>
    <p class="sub">13 Fragen. Ein brutal ehrliches Urteil. Finde heraus, wo du im Spektrum der Männlichkeit stehst.</p>
    <div class="spectrum">
      <span class="chip"><span class="emo">🦍</span> Alpha</span>
      <span class="chip"><span class="emo">🐑</span> Beta</span>
      <span class="chip"><span class="emo">🐺</span> Sigma</span>
    </div>
    <button class="btn" id="start">Los geht's 🔥</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen" hidden>
    <div class="qmeta">
      <span id="counter">Frage 1 / 13</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <h2 class="question display" id="qtext"></h2>
    <div class="answers" id="answers"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen" hidden>
    <div class="result-emo" id="remo"></div>
    <p class="verdict" id="verdict">Außerhalb des Spektrums</p>
    <h2 class="rtitle display" id="rtitle">Durchgefallen</h2>
    <p class="alias" id="ralias"></p>
    <p class="rdesc" id="rdesc"></p>
    <div class="actions">
      <button class="btn" id="share">Ergebnis teilen 📣</button>
      <button class="btn ghost" id="again">Nochmal testen ↻</button>
    </div>
    <p class="toast" id="toast"></p>
  </section>

</div>

<script>
  // --- Fragen ---
  // Jede Antwort hat einen verdeckten "Durchfall"-Topf: fuss (Short King),
  // cli (Incel) oder schn (Taugenichts). Egal was man wählt – man fällt IMMER
  // aus dem Spektrum. Welcher Typ gewinnt, hängt vom Antwortstil ab.
  const QUESTIONS = [
    { q: "Dein Wecker klingelt um 5:30 Uhr. Was machst du?", a: [
      ["Aufstehen. Disziplin schläft nicht.", "cli"],
      ["Snooze. Zweimal. Okay, dreimal.", "schn"],
      ["War eh wach – habe meinen Grindset optimiert.", "fuss"],
      ["Welcher Wecker? Mama weckt mich zum Mittagessen.", "schn"],
    ]},
    { q: "Im Fitnessstudio bist du der Typ, der …", a: [
      ["… die schwersten Hanteln nimmt und laut dabei ist.", "cli"],
      ["… brav genau das macht, was der Trainer sagt.", "schn"],
      ["… um 23 Uhr allein trainiert, Kopfhörer rein, Welt aus.", "fuss"],
      ["… nur das Spiegel-Foto macht und wieder geht.", "cli"],
    ]},
    { q: "Beim ersten Date …", a: [
      ["… führe ich. Ich habe den Plan.", "cli"],
      ["… bin ich nervös und zahle sicherheitshalber alles.", "schn"],
      ["… entscheide ich spontan, ob ich überhaupt erscheine.", "fuss"],
      ["Date? Ich kenne Frauen nur aus YouTube-Kommentaren.", "cli"],
    ]},
    { q: "Deine Körpergröße ist …", a: [
      ["1,90 m. Blick von oben inklusive.", "cli"],
      ["Durchschnitt. Passt schon.", "schn"],
      ["Egal – ich messe mich an meinem Mindset.", "fuss"],
      ["Ich sehe als Erster, wenn die Fußleiste staubt.", "fuss"],
    ]},
    { q: "Deine Freunde machen Pläne ohne dich. Du …", a: [
      ["… rufst an und übernimmst sofort die Organisation.", "cli"],
      ["… bist traurig, sagst aber nichts.", "schn"],
      ["… hast eh keine Zeit. Lone-Wolf-Life.", "fuss"],
      ["… hast keine Freunde, die Pläne machen könnten.", "cli"],
    ]},
    { q: "Dein Verhältnis zu Geld:", a: [
      ["Ich verdiene es, gebe es aus, dominiere den Markt.", "cli"],
      ["Ich spare brav und frage lieber nochmal nach.", "schn"],
      ["Passives Einkommen, während ihr schlaft.", "fuss"],
      ["Haste mal 'n Zehner? Zahl ich zurück. Irgendwann.", "schn"],
    ]},
    { q: "Jemand rempelt dich in der Bahn an. Reaktion?", a: [
      ["Breitbeinig stehen bleiben, Blickkontakt halten.", "cli"],
      ['"Oh, tut mir leid!" – obwohl er schuld war.', "schn"],
      ["Keine Reaktion. Emotionen sind für die Masse.", "fuss"],
      ["Ich falle um. 58 kg bei 1,63 m.", "fuss"],
    ]},
    { q: "Social Media ist für dich …", a: [
      ["… die Bühne für Erfolge und Oberkörperfotos.", "cli"],
      ["… zum Liken und netten Kommentieren.", "schn"],
      ["… gelöscht. Ich baue im Stillen ein Imperium.", "fuss"],
      ["… der Kommentarbereich, wo ich Frauen das Leben erkläre.", "cli"],
    ]},
    { q: "Dein ideales Wochenende:", a: [
      ["Party. Ich bin der Mittelpunkt, alle kennen meinen Namen.", "cli"],
      ["Gemütlich. Hauptsache, alle sind zufrieden.", "schn"],
      ["Allein. Bücher, kalte Dusche, 4 Uhr morgens raus.", "fuss"],
      ["Couch bei Mama. Ihr WLAN, ihr Kühlschrank.", "schn"],
    ]},
    { q: "Wie reagierst du auf Kritik?", a: [
      ["Kritik? An mir? Niedlich.", "cli"],
      ["Ich entschuldige mich und ändere sofort alles.", "schn"],
      ["Ich nicke – und mache danach mein Ding.", "fuss"],
      ["Ich erkläre stundenlang, warum die Welt gegen mich ist.", "cli"],
    ]},
    { q: "Dein Fortbewegungsmittel sagt über dich:", a: [
      ["PS, Lautstärke, Präsenz.", "cli"],
      ["Sicher, sparsam, TÜV immer pünktlich.", "schn"],
      ["Kein Status nötig. Fahrrad, Fokus, Freiheit.", "fuss"],
      ["Der Bus – mit dem Ticket meiner Mutter.", "schn"],
    ]},
    { q: "Du schaust in den Spiegel und denkst:", a: [
      ["Was für ein Prachtexemplar.", "cli"],
      ["Geht schon, oder? Sag mal ehrlich.", "schn"],
      ["Der Spiegel ist mir egal. Ich schaue nach innen.", "fuss"],
      ["Ich muss auf die Zehenspitzen, um reinzuschauen.", "fuss"],
    ]},
    { q: "Was ist dein Lebensmotto?", a: [
      ["Gewinnen. Immer. Überall.", "cli"],
      ["Sei nett, dann sind alle nett zu dir.", "schn"],
      ["Vertraue niemandem. Arbeite im Schatten.", "fuss"],
      ["Warum selbst machen, wenn's andere für mich zahlen?", "schn"],
    ]},
  ];

  const RESULTS = {
    fuss: { emo:"📏", title:"Der Short King", alias:"Der Fußleisteninspektor",
      desc:"Überraschung – du passt nicht ins Spektrum, weil du schlicht darunter durchläufst. Als Erster weißt du, ob die Fußleisten gewischt sind, und bei Gruppenfotos stehst du immer „strategisch vorne\".",
      note:"Aber ganz ehrlich: Energie schlägt Zentimeter. Steh gerade – es sieht eh keiner." },
    cli: { emo:"🔬", title:"Der Incel", alias:"Der Clitorisforscher",
      desc:"Überraschung – du hast dich aus dem Spektrum herauskommentiert. Dein Wissen über Frauen ist rein theoretisch, akribisch aus Foren und Statistiken zusammengetragen. Praktische Feldforschung steht noch aus. Für immer.",
      note:"Vorschlag: Lass das Handy mal liegen und sag im echten Leben einfach „Hallo\". Wirkt Wunder." },
    schn: { emo:"🛋️", title:"Der Taugenichts", alias:"Der Schnorrer",
      desc:"Überraschung – du bist nicht Alpha, nicht Beta, nicht Sigma. Du bist auf Mamas Couch und lebst von ihrem WLAN. Warum selbst zahlen, wenn man so gut fragen kann? Dein Lebenslauf hat eine Lücke in Form eines Sofas.",
      note:"Gute Nachricht: Vom Taugenichts ist es nur ein kleiner Schritt zum Lebenskünstler. Steh einmal auf." },
  };

  const el = (id) => document.getElementById(id);
  const screens = { intro: el("intro"), quiz: el("quiz"), result: el("result") };
  function show(name) { for (const k in screens) screens[k].hidden = (k !== name); window.scrollTo(0,0); }

  // Fisher-Yates
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let idx = 0;
  let scores = {};

  function startQuiz() {
    idx = 0;
    scores = { fuss:0, cli:0, schn:0 };
    show("quiz");
    render();
  }

  function render() {
    const item = QUESTIONS[idx];
    el("counter").textContent = `Frage ${idx+1} / ${QUESTIONS.length}`;
    const pct = Math.round((idx / QUESTIONS.length) * 100);
    el("pct").textContent = pct + "%";
    el("fill").style.width = pct + "%";
    el("qtext").textContent = item.q;
    const box = el("answers");
    box.innerHTML = "";
    shuffle(item.a).forEach(([text, bucket]) => {
      const b = document.createElement("button");
      b.className = "ans";
      b.type = "button";
      b.textContent = text;
      b.addEventListener("click", () => choose(bucket));
      box.appendChild(b);
    });
  }

  function choose(bucket) {
    scores[bucket] = (scores[bucket] || 0) + 1;
    idx++;
    if (idx < QUESTIONS.length) {
      render();
    } else {
      el("fill").style.width = "100%";
      finish();
    }
  }

  // Gewinner = höchster Topf; bei Gleichstand zufällig unter den Führenden
  function winner() {
    const keys = ["fuss", "cli", "schn"];
    let max = -1;
    for (const k of keys) if ((scores[k] || 0) > max) max = scores[k] || 0;
    const top = keys.filter(k => (scores[k] || 0) === max);
    return top[Math.floor(Math.random() * top.length)];
  }

  function finish() {
    const key = winner();
    const r = RESULTS[key];
    el("remo").textContent = r.emo;
    el("ralias").textContent = `${r.title} · ${r.alias}`;
    el("rdesc").innerHTML = r.desc + `<span class="muted">${r.note}</span>`;
    el("toast").textContent = "";
    el("share").dataset.key = key;
    show("result");
  }

  async function share() {
    const key = el("share").dataset.key;
    const r = RESULTS[key];
    const text = `Ich bin „${r.title} – ${r.alias}" im Alpha-Beta-Sigma-Test – komplett aus dem Spektrum gefallen 💀. Und du? ${location.href}`;
    try {
      await navigator.clipboard.writeText(text);
      el("toast").textContent = "In die Zwischenablage kopiert ✔";
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); el("toast").textContent = "In die Zwischenablage kopiert ✔"; }
      catch (_) { el("toast").textContent = "Konnte nicht automatisch kopieren – Text manuell markieren."; }
      ta.remove();
    }
  }

  el("start").addEventListener("click", startQuiz);
  el("again").addEventListener("click", () => show("intro"));
  el("share").addEventListener("click", share);
</script>
</body>
</html>
